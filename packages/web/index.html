<!doctype html>
<html lang="zh-CN" class="dark" data-theme="forest">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wingdex · 生灵图鉴</title>
    <script>
      (function () {
        var theme = 'forest'
        try {
          var direct = localStorage.getItem('wingdex.theme')
          var prefs = JSON.parse(localStorage.getItem('wingdex.prefs') || 'null')
          var candidate = (prefs && prefs.theme) || direct
          if (candidate === 'journal' || candidate === 'forest' || candidate === 'obsidian') theme = candidate
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme === 'journal' ? 'light' : 'dark'
        document.documentElement.classList.toggle('dark', theme !== 'journal')
      })()
    </script>
  </head>
  <body class="bg-ink-900 text-fog-100 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
